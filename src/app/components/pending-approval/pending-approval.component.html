<div class="pending-page d-flex align-items-center justify-content-center">
  <div class="card pending-card shadow-sm text-center">
    <div class="card-body p-4">
      <div class="fs-1 mb-2">⏳</div>
      <h1 class="h4 fw-bold mb-2">Pending Approval</h1>
      <p class="text-muted mb-4">
        Your account has been created but hasn't been approved yet. You'll be able to sign in
        once an admin approves your access.
      </p>
      <button type="button" class="btn btn-outline-secondary" (click)="logout()">Log out</button>
    </div>
  </div>
</div>
