<app-site-header></app-site-header>

<div class="reset-page d-flex align-items-center justify-content-center">
  <div class="card reset-card shadow-sm">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <h1 class="fw-bold text-primary h3 mb-1">Set a New Password</h1>
        <p class="text-muted small mb-0">Choose a new password for your account</p>
      </div>

      @if (!done()) {
        <form [formGroup]="form" (ngSubmit)="submit()">
          <div class="mb-3">
            <label class="form-label">New Password</label>
            <input
              formControlName="password"
              type="password"
              class="form-control form-control-lg"
              placeholder="New password"
              autocomplete="new-password">
            @if (form.get('password')?.touched && form.get('password')?.invalid) {
              <div class="form-text text-danger">Password must be at least 6 characters.</div>
            }
          </div>

          <div class="mb-3">
            <label class="form-label">Confirm Password</label>
            <input
              formControlName="confirmPassword"
              type="password"
              class="form-control form-control-lg"
              placeholder="Confirm new password"
              autocomplete="new-password">
          </div>

          @if (error) {
            <div class="alert alert-danger py-2 small" role="alert">{{ error }}</div>
          }

          <button type="submit" class="btn btn-primary btn-lg w-100 mt-2" [disabled]="loading()">
            {{ loading() ? 'Updating...' : 'Update Password' }}
          </button>
        </form>
      } @else {
        <div class="alert alert-success text-center">
          ✅ Password updated! Redirecting you now...
        </div>
      }
    </div>
  </div>
</div>

<app-site-footer></app-site-footer>
