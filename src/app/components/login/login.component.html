<div class="login-page d-flex align-items-center justify-content-center">
  <div class="card login-card shadow-sm">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <h1 class="fw-bold text-primary h3 mb-1">Resume PDF Generator</h1>
        <p class="text-muted small mb-0">Sign in to continue</p>
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input
            formControlName="email"
            type="email"
            class="form-control form-control-lg"
            placeholder="you@email.com"
            autocomplete="username">
          @if (form.get('email')?.touched && form.get('email')?.invalid) {
            <div class="form-text text-danger">Enter a valid email address.</div>
          }
        </div>

        <div class="mb-3">
          <label class="form-label">Password</label>
          <input
            formControlName="password"
            type="password"
            class="form-control form-control-lg"
            placeholder="Password"
            autocomplete="current-password">
          @if (form.get('password')?.touched && form.get('password')?.invalid) {
            <div class="form-text text-danger">Password is required.</div>
          }
        </div>

        @if (error) {
          <div class="alert alert-danger py-2 small" role="alert">{{ error }}</div>
        }

        <button type="submit" class="btn btn-primary btn-lg w-100 mt-2">Sign In</button>
      </form>
    </div>
  </div>
</div>
